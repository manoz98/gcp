steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/learning-485615/gcp-devops/app-image:$SHORT_SHA'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/learning-485615/gcp-devops/app-image:$SHORT_SHA'
      
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-cloud-run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying image to cloud run"
        gcloud run deploy app-image \
          --image us-central1-docker.pkg.dev/learning-485615/gcp-devops/app-image:$SHORT_SHA \
          --region us-central1 
          --platform managed
          --allow-unauthenticated
          --port 8080
images: 
  - 'us-central1-docker.pkg.dev/learning-485615/gcp-devops/app-image:$SHORT_SHA' 
options:
  logging: CLOUD_LOGGING_ONLY
